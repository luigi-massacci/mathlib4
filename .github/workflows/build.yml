name: continuous integration

# TRIAL STUB (luigi-massacci/mathlib4 only, to be reverted): the real build
# cannot run on a fork, so upload `crossrefs-fixture.json` as the
# `import-graph` artifact's `crossrefs.json` for `crossref-diff.yml`.

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          cp crossrefs-fixture.json crossrefs.json
          printf '' > pr_number.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: import-graph
          path: |
            crossrefs.json
            pr_number.txt
